name: release

# Выпуск: собирает OdinsEye-<версия>.dmg и выкладывает его на страницу
# Releases, откуда его скачивают и ставят перетаскиванием в «Программы».
#
# Запускается сам, когда в main или рабочей ветке меняется Scripts/version:
# новый номер — новый релиз, тег v<версия> ставит сам релиз. Ещё — пушем тега
# или кнопкой Run workflow на вкладке Actions. Уже выпущенная версия второй
# раз не выпускается: при пуше это тихий пропуск, при кнопке — ошибка.
#
# Подпись. С секретами Apple Developer ID (см. README, «Подпись и
# нотаризация») образ подписан и нотаризован: macOS открывает его сразу, без
# вопросов. Без них образ подписан ad-hoc, и при первом запуске каждой
# скачанной версии macOS попросит подтвердить открытие в Системных настройках.
# Релиз выходит в обоих случаях, заметки к нему говорят, какой это.
on:
  push:
    tags: ['v*']
    branches: [main, 'claude/**']
    paths: ['Scripts/version', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Секреты нельзя читать в `if` напрямую, поэтому их наличие снимается
      # здесь в обычную переменную.
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Версия и тег
        run: |
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "::error::тег $GITHUB_REF_NAME, а в Scripts/version $VERSION"; exit 1; }
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "версия $VERSION уже выпущена — пропуск"
              echo "SKIP=1" >> "$GITHUB_ENV"
            else
              echo "::error::версия $VERSION уже выпущена — поднимите номер в Scripts/version"
              exit 1
            fi
          fi

      - name: Сертификат Developer ID во временную связку ключей
        if: env.SKIP != '1' && env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Иначе codesign остановится на диалоге «разрешить доступ к ключу»,
          # которого на раннере никто не увидит.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "::error::в .p12 нет сертификата Developer ID Application"; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Ключ нотаризации
        if: env.SKIP != '1' && env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY_BASE64: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}"
            echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}"
            echo "NOTARIZE=1"
          } >> "$GITHUB_ENV"

      - name: Тесты
        if: env.SKIP != '1'
        run: ./Scripts/test.sh

      - name: Образ
        if: env.SKIP != '1'
        run: ./Scripts/dmg.sh

      - name: Контрольная сумма
        if: env.SKIP != '1'
        run: |
          shasum -a 256 "build/OdinsEye-$VERSION.dmg" | tee build/SHA256SUMS
          codesign --verify --strict "build/OdinsEye.app"

      - name: Релиз на GitHub
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/OdinsEye-$VERSION.dmg"
          BODY="$(mktemp)"
          {
            echo "## Установка"
            echo
            echo "1. Скачайте **OdinsEye-$VERSION.dmg** ниже, в разделе Assets."
            echo "2. Откройте его и перетащите **Odin's Eye** в папку «Программы»."
            if [ "${NOTARIZE:-0}" = 1 ]; then
              echo "3. Запустите из «Программ» или Launchpad — приложение подписано и проверено Apple."
            else
              echo "3. Запустите из «Программ». macOS скажет, что не может проверить приложение — нажмите **Готово**."
              echo "4. Откройте **Системные настройки → Конфиденциальность и безопасность**, внизу у строки про Odin's Eye нажмите **«Всё равно открыть»** и подтвердите паролем."
              echo
              echo "Так при первом запуске каждой новой версии: сборка без подписи Apple Developer ID."
            fi
            echo
            echo "При обновлении закройте старую версию (меню ворона → «Выйти») и замените приложение в «Программах»."
            echo
            printf '**SHA-256** `%s`\n' "$(cut -d' ' -f1 build/SHA256SUMS)"
          } > "$BODY"
          PREVIOUS="$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)"
          if [ -n "$PREVIOUS" ]; then
            printf '\n## Изменения\n\n' >> "$BODY"
            git log --no-merges --format='- %s' "$PREVIOUS..HEAD" >> "$BODY"
          fi
          gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" \
              --title "Odin's Eye $VERSION" --notes-file "$BODY" --latest
          gh release view "$TAG" --json url --jq '.url'
